spring.application.name=pghub-gateway

server.port=8082

eureka.client.service-url.defaultZone=http://localhost:8761/eureka/

eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true

eureka.instance.prefer-ip-address=true

#gateway route


spring.cloud.gateway.server.webflux.routes[0].id=logging-service
spring.cloud.gateway.server.webflux.routes[0].uri=lb://LOGGING-SERVICE
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/api/logs/**

spring.cloud.gateway.server.webflux.routes[1].id=backend-service
spring.cloud.gateway.server.webflux.routes[1].uri=lb://BACKEND
spring.cloud.gateway.server.webflux.routes[1].predicates[0]=Path=/**



spring.cloud.gateway.server.webflux.globalcors.cors-configurations.[/**].allowedOrigins=http://localhost:5173
spring.cloud.gateway.server.webflux.globalcors.cors-configurations.[/**].allowedMethods=GET,POST,PUT,DELETE,OPTIONS
spring.cloud.gateway.server.webflux.globalcors.cors-configurations.[/**].allowedHeaders=*
spring.cloud.gateway.server.webflux.globalcors.cors-configurations.[/**].allowCredentials=true

spring.cloud.gateway.server.webflux.default-filters[0].name=DedupeResponseHeader
spring.cloud.gateway.server.webflux.default-filters[0].args.name=Access-Control-Allow-Origin Access-Control-Allow-Credentials
spring.cloud.gateway.server.webflux.default-filters[0].args.strategy=RETAIN_FIRST
